[package]
name = "readtime"
version = "0.1.7"
edition = "2024"
authors = ["Scott Idler"]
build = "build.rs"
description = "Estimate reading time for text documents"

[dependencies]
clap = { version = "4.5.52", features = ["derive"] }
colored = "3.0.0"
dirs = "6.0.0"
env_logger = "0.11.8"
eyre = "0.6.12"
log = "0.4.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
walkdir = "2"
unicode-width = "0.2"

[build-dependencies]
build-version = { git = "https://github.com/tatari-tv/build-version-rs", tag = "v0.1.0", version = "0.1.0" }

[dev-dependencies]
tempfile = "3"
